<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 1 Javascript</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            max-width: 700px;
            margin:40px auto;
            padding:20px;
            line-height: 1.6;
        }

        button{
            padding:10px 16px;
            cursor:pointer;
        }

        #tips{
            margin-top: 16px;
            padding: 15px;
            background-color: #f0f5f1;
            border-left: 4px #0f6a4a;

        }


    </style>
</head>
<body>
    <h1>Customer Registration Form</h1>
    <p>
        Latihan Menggunakan Javascript
    </p>

    <button id="toggleButton" type="button">
        Tampilkan Petunjuk
    </button>

    <div id="tips" hidden>
        <strong>Petunjuk Pengisian</strong>
        <p>
            Isi nama lengkap dan email dengan benar sebelum mengisi formulir
        </p>
    </div>

    <script>
        console.log("Javascript berhasil dimuat.");

        const toggleButton = document.querySelector("#toggleButton");
        const tips = document.querySelector("#tips");

        toggleButton.addEventListener("click", function(){
            tips.hidden = !tips.hidden;

            console.log("Tombol di klik");

            
        });
    </script>


</body>
</html>
